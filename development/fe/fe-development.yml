apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend-development
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-frontend-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2
  template:
      metadata:
        labels:
          app: ecommerce-frontend-app
      spec:
        containers:
          - name: ecommerce-frontend
            image: tannghidevops/ecommerce-frontend:v9
            ports: 
              - containerPort: 80
                name: tcp
                protocol: TCP
            resources:
              requests:
                cpu: "125m"
                memory: "250Mi"
              limits:
                cpu: "250m"
                memory: "500Mi"
        imagePullSecrets:
          - name: auth-registry
        

