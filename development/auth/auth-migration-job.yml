apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-db-migration
  namespace: ecommerce
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3  # try 3 times if failed
  ttlSecondsAfterFinished: 3600  # auto delete job after 1 hour
  template:
    spec:
      initContainers:
        - name: wait-for-postgres-auth-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nslookup postgres-auth.ecommerce.svc.cluster.local && nc -z postgres-auth 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: migrations
        image: tannghidevops/authentication-service:v3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL to be ready..."
            sleep 5
            echo "Running database migration once..."
            /app/authentication-service migrate
            echo "Migration completed!"
        env:
        - name: AUTH_DB_HOST
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_HOST
        - name: AUTH_DB_PORT
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_PORT
        - name: AUTH_DB_NAME
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_NAME
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_USER
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_PASSWORD
        - name: AUTH_DB_SSLMODE
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: AUTH_DB_SSLMODE
        - name: MIGRATION_PATH
          valueFrom:
            secretKeyRef:
              name: ecommerce-auth-secret
              key: MIGRATION_PATH
      restartPolicy: OnFailure 