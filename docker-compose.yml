services:
  broker-service:
    container_name: broker-service
    image: broker-service:v1
    build:
      context: ./services/broker-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      CART_SERVICE_HOST: cart-service:50054
      CHECKOUT_SERVICE_HOST: checkout-service:50055
    depends_on:
      - cart-service
      - checkout-service
    networks:
      - net

  # Cart Service
  cart-service:
    container_name: cart-service
    image: cart-service:v1
    build:
      context: ./services/cart-service
    restart: always
    ports:
      - "50054:50054"
    depends_on:
      - redis-cart
    networks:
      - net

  # Redis for Cart Service
  redis-cart:
    container_name: redis-cart
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - ./db-data/redis-cart:/data
      - ./services/cart-service/internal/repository/redis/db:/docker-entrypoint-initdb.d
    restart: always
    entrypoint: >
      sh -c "
        redis-server --appendonly yes &
        sleep 5 &&
        chmod +x /docker-entrypoint-initdb.d/02-initdb.sh &&
        /docker-entrypoint-initdb.d/02-initdb.sh &&
        wait
      "
    networks:
      - net

  # Checkout Service
  checkout-service:
    container_name: checkout-service
    image: checkout-service:v1
    build:
      context: ./services/checkout-service
    restart: always
    ports:
      - "50055:50055"
    depends_on:
      - mongo-checkout
    networks:
      - net

  # MongoDB for Checkout Service
  mongo-checkout:
    container_name: mongo-checkout
    image: "mongo:5"
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: checkout
    volumes:
      - ./db-data/mongo-checkout:/data/db
      - ./services/checkout-service/internal/repository/mongodb/db:/docker-entrypoint-initdb.d
    command: [ "--logpath", "/var/log/mongodb/mongod.log", "--logappend" ]
    networks:
      - net

  authentication-service:
    container_name: authentication-service
    image: authentication-service:v1
    build:
      context: ./services/authentication-service
    restart: always
    ports:
      - "50051:50051"
    environment:
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: ${AUTH_DB_PORT}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME}
      DB_SSLMODE: ${AUTH_DB_SSLMODE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_DURATION: ${JWT_ACCESS_DURATION}
      JWT_REFRESH_DURATION: ${JWT_REFRESH_DURATION}
    depends_on:
      - postgres-auth
    networks:
      - net

  user-service:
    container_name: user-service
    image: user-service:v1
    build:
      context: ./services/user-service
    restart: always
    ports:
      - "50052:50052"
    environment:
      DB_HOST: ${USER_DB_HOST}
      DB_PORT: ${USER_DB_PORT}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: ${USER_DB_NAME}
      DB_SSLMODE: ${USER_DB_SSLMODE}
    depends_on:
      - postgres-users
    networks:
      - net

  product-service:
    container_name: product-service
    image: product-service:v1
    build:
      context: ./services/product-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      DSN: ${PRODUCT_DSN}
    depends_on:
      - postgres-products
    networks:
      - net

  logger-service:
    container_name: logger-service
    image: logger-service:v1
    build:
      context: ./services/logger-service
    restart: always
    networks:
      - net

  mail-service:
    container_name: mail-service
    image: mail-service:v1
    build:
      context: ./services/mail-service
    restart: always
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FROM_NAME: ${FROM_NAME}
      FROM_ADDR: ${FROM_ADDR}
    networks:
      - net

  listener-service:
    container_name: listener-service
    image: listener-service:v1
    build:
      context: ./services/listener-service
    restart: always
    networks:
      - net

  postgres:
    container_name: postgres
    image: "postgres:14.0"
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
      POSTGRES_MULTIPLE_DATABASES: users,products
    volumes:
      - ./db-data/postgres:/var/lib/postgresql/data/
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - net

  postgres-products:
    container_name: postgres-products
    image: "postgres:14.0"
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres-products
      POSTGRES_PASSWORD: password
      POSTGRES_DB: products
    volumes:
      - ./db-data/postgres-products:/var/lib/postgresql/data/
      - ./services/product-service/internal/repository/postgres/db:/docker-entrypoint-initdb.d
    #command: bash -c "chmod +x /docker-entrypoint-initdb.d/db/01-schema.sql && chmod +x /docker-entrypoint-initdb.d/db/02-data.sql && docker-entrypoint.sh postgres"
    networks:
      - net

  postgres-auth:
    container_name: postgres-auth
    image: "postgres:14.0"
    ports:
      - "5435:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres-auth
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth
    volumes:
      - ./db-data/postgres-auth:/var/lib/postgresql/data/
      - ./services/authentication-service/scripts/db:/docker-entrypoint-initdb.d
    networks:
      - net
  postgres-users:
    container_name: postgres-users
    image: "postgres:14.0"
    ports:
      - "5434:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres-users
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - ./db-data/postgres-users:/var/lib/postgresql/data/
      - ./services/user-service/scripts/db:/docker-entrypoint-initdb.d
    #command: bash -c "chmod +x /docker-entrypoint-initdb.d/db/01-schema.sql && chmod +x /docker-entrypoint-initdb.d/db/02-data.sql && docker-entrypoint.sh postgres"
    networks:
      - net

  mongo-logger:
    image: "mongo:4.2.16-bionic"
    container_name: mongo-logger
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: logs
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./db-data/mongo/:/data/db
    networks:
      - net

  rabbitmq:
    container_name: rabbitmq
    image: "rabbitmq:3.9-alpine"
    ports:
      - "5672:5672"
    volumes:
      - ./db-data/rabbitmq/:/var/lib/rabbitmq/
    networks:
      - net

networks:
  net:
    driver: bridge
