workflow:
  rules:
    - if: $CI_COMMIT_TAG           
      when: always
    - when: never

include:
  - local: "ci/templates/.gitlab-ci-be-dev.yml"
    rules:
      - if: '$CI_COMMIT_TAG =~ /-dev$/'

  - local: "ci/templates/.gitlab-ci-staging.yml"
    rules:
      - if: '$CI_COMMIT_TAG =~ /-staging$/'

  - local: "ci/templates/.gitlab-ci-pre-prod.yml"
    rules:
      - if: '$CI_COMMIT_TAG =~ /-pre-prod$/'

  - local: "ci/templates/.gitlab-ci-prod.yml"
    rules:
      - if: '$CI_COMMIT_TAG =~ /-prod$/'
