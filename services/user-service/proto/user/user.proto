syntax = "proto3";

package user;
option go_package = "user-service/proto/user";

service UserService {
  // GetUser retrieves a user by ID
  rpc GetUser(GetUserRequest) returns (UserResponse) {}

  // GetUsers retrieves a list of users with optional filtering
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {}

  // CreateUser creates a new user
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {}

  // UpdateUser updates user information
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse) {}

  // DeleteUser deletes a user
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // SearchUsers searches for users based on criteria
  rpc SearchUsers(SearchUsersRequest) returns (GetUsersResponse) {}

  // ProcessEvent handles events from other services (like user registration,
  // password changes)
  rpc ProcessEvent(EventRequest) returns (EventResponse) {}

  // LogUserActivity logs a user activity
  rpc LogUserActivity(LogUserActivityRequest)
      returns (LogUserActivityResponse) {}

  // GetUserActivityLogs retrieves user activity logs
  rpc GetUserActivityLogs(GetUserActivityLogsRequest)
      returns (GetUserActivityLogsResponse) {}

  // GetUserStatistics retrieves statistics for the admin dashboard
  rpc GetUserStatistics(GetUserStatisticsRequest)
      returns (GetUserStatisticsResponse) {}

  // GetUserActivityChart retrieves data for the customer activity chart
  rpc GetUserActivityChart(GetUserActivityChartRequest)
      returns (GetUserActivityChartResponse) {}

  // SyncUserOrderData synchronizes user order data from checkout service
  rpc SyncUserOrderData(SyncUserOrderDataRequest)
      returns (SyncUserOrderDataResponse) {}
}

// User represents a user entity
message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string display_name = 5;
  string phone = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
  bool active = 10;
  string created_at = 11;
  string updated_at = 12;
  int32 order_count = 13;
  double total_spend = 14;
  string last_login = 15;
}

// Address represents a user address
message Address {
  string id = 1;
  string line1 = 2;
  string line2 = 3;
  string city = 4;
  string state = 5;
  string postal_code = 6;
  string country = 7;
  bool is_default = 8;
  string address_type = 9; // shipping, billing, etc.
}

// GetUserRequest is used to request a user by ID
message GetUserRequest { string id = 1; }

// CreateUserRequest contains data for creating a new user
message CreateUserRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string display_name = 4;
  string phone = 5;
  string password = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
}

// UpdateUserRequest contains data for updating a user
message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string display_name = 5;
  string phone = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
  bool active = 10;
}

// DeleteUserRequest is used to request deletion of a user
message DeleteUserRequest { string id = 1; }

// DeleteUserResponse is the response for a delete user operation
message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// UserResponse is the response containing user data
message UserResponse {
  User user = 1;
  string message = 2;
}

// GetUsersRequest is used to request a list of users with optional filtering
message GetUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string sort_by = 3;
  string sort_order = 4;
  string role = 5;
  bool active = 6; // Filter by active status
}

// GetUsersResponse contains a list of users
message GetUsersResponse {
  repeated User users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  string message = 5;
}

// SearchUsersRequest is used to search for users
message SearchUsersRequest {
  string query = 1;
  string field = 2;
  int32 page = 3;
  int32 limit = 4;
}

// EventRequest contains event data from other services
message EventRequest {
  string event_id = 1;
  string event_name = 2;
  string event_data = 3;
  string source = 4;
  string created_at = 5;
}

// EventResponse is the response for event processing
message EventResponse {
  bool success = 1;
  string message = 2;
}

// LogUserActivityRequest is used to log a user activity
message LogUserActivityRequest {
  string user_id = 1;
  string action = 2;
  string message = 3;
  string metadata = 4; // JSON string of additional metadata
}

// LogUserActivityResponse is the response for logging a user activity
message LogUserActivityResponse {
  bool success = 1;
  string message = 2;
}

// GetUserActivityLogsRequest is used to request user activity logs
message GetUserActivityLogsRequest {
  string user_id = 1;
  string action_type = 2; // Optional filter by action type
}

// GetUserActivityLogsResponse contains user activity logs
message GetUserActivityLogsResponse {
  string logs = 1; // JSON string of logs
  bool success = 2;
  string message = 3;
}

// GetUserStatisticsRequest is used to request user statistics for admin
// dashboard
message GetUserStatisticsRequest {
  // Empty request as we'll return all statistics
}

// GetUserStatisticsResponse contains user statistics
message GetUserStatisticsResponse {
  int32 total_users = 1;
  double user_growth = 2;
  int32 new_users = 3;
  double new_user_growth = 4;
  int32 visitors = 5;
  double visitor_growth = 6;
  int32 active_users = 7;
  int32 repeat_customers = 8;
  int32 shop_visitors = 9;
  double conversion_rate = 10;
}

// GetUserActivityChartRequest is used to request user activity chart data
message GetUserActivityChartRequest {
  int32 days = 1;        // Number of days to include in the chart
  string chart_type = 2; // Type of chart: "activity", "new_users", "orders",
                         // "revenue", "conversion"
}

// UserActivityChartPoint represents a single data point in the activity chart
message UserActivityChartPoint {
  string day = 1;   // Day of week (e.g., "Mon")
  string date = 2;  // Full date (e.g., "2023-07-10")
  int32 count = 3;  // Primary count value (users/orders/etc)
  double value = 4; // Secondary value (revenue/conversion/etc)
}

// GetUserActivityChartResponse contains user activity chart data
message GetUserActivityChartResponse {
  repeated UserActivityChartPoint chart_data = 1;
  string chart_type = 2;
  string title = 3;
  string y_axis_label = 4;
  string description = 5;
  double total_value = 6;
  double avg_value = 7;
  double max_value = 8;
  double min_value = 9;
  double growth_rate = 10;
}

// SyncUserOrderDataRequest is used to sync a user's order data
message SyncUserOrderDataRequest {
  string user_id = 1;
  int32 order_count = 2;
  double total_spend = 3;
}

// SyncUserOrderDataResponse is the response for syncing order data
message SyncUserOrderDataResponse {
  bool success = 1;
  string message = 2;
}