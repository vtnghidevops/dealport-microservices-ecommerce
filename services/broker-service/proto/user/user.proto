syntax = "proto3";

package user;
option go_package = "broker-service/proto/user";

service UserService {
  // GetUser retrieves a user by ID
  rpc GetUser(GetUserRequest) returns (UserResponse) {}

  // GetUsers retrieves a list of users with optional filtering
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {}

  // CreateUser creates a new user
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {}

  // UpdateUser updates user information
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse) {}

  // DeleteUser deletes a user
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // SearchUsers searches for users based on criteria
  rpc SearchUsers(SearchUsersRequest) returns (GetUsersResponse) {}

  // Wishlist methods
  rpc AddToWishlist(AddToWishlistRequest) returns (WishlistResponse) {}
  rpc RemoveFromWishlist(RemoveFromWishlistRequest) returns (WishlistResponse) {
  }
  rpc GetWishlist(GetWishlistRequest) returns (GetWishlistResponse) {}

  // GetUserStatistics retrieves statistics for the admin dashboard
  rpc GetUserStatistics(GetUserStatisticsRequest)
      returns (GetUserStatisticsResponse) {}

  // GetUserActivityChart retrieves data for the customer activity chart
  rpc GetUserActivityChart(GetUserActivityChartRequest)
      returns (GetUserActivityChartResponse) {}
}

// User represents a user entity
message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string display_name = 5;
  string phone = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
  bool active = 10;
  string created_at = 11;
  string updated_at = 12;
  string username = 13;
  repeated int32 wishlist = 14;
  int32 order_count = 15;
  double total_spend = 16;
  string last_login = 17;
}

// Address represents a user address
message Address {
  string id = 1;
  string line1 = 2;
  string line2 = 3;
  string city = 4;
  string state = 5;
  string postal_code = 6;
  string country = 7;
  bool is_default = 8;
  string address_type = 9;  // shipping, billing, etc.
}

// WishlistItem represents an item in a user's wishlist
message WishlistItem {
  string id = 1;
  string user_id = 2;
  int32 product_id = 3;
  string added_at = 4;
  string notes = 5;
}

// GetUserRequest is used to request a user by ID
message GetUserRequest {
  string id = 1;
}

// CreateUserRequest contains data for creating a new user
message CreateUserRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string display_name = 4;
  string phone = 5;
  string password = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
}

// UpdateUserRequest contains data for updating a user
message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string display_name = 5;
  string phone = 6;
  string profile_image = 7;
  repeated Address addresses = 8;
  string role = 9;
  bool active = 10;
}

// DeleteUserRequest is used to request deletion of a user
message DeleteUserRequest {
  string id = 1;
}

// DeleteUserResponse is the response for a delete user operation
message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// UserResponse is the response containing user data
message UserResponse {
  User user = 1;
  string message = 2;
}

// GetUsersRequest is used to request a list of users with optional filtering
message GetUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string sort_by = 3;
  string sort_order = 4;
  string role = 5;
  bool active = 6;  // Filter by active status
}

// GetUsersResponse contains a list of users
message GetUsersResponse {
  repeated User users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  string message = 5;
}

// SearchUsersRequest is used to search for users
message SearchUsersRequest {
  string query = 1;
  string field = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Wishlist messages
message AddToWishlistRequest {
  string user_id = 1;
  int32 product_id = 2;
  string notes = 3;
}

message RemoveFromWishlistRequest {
  string user_id = 1;
  int32 product_id = 2;
}

message GetWishlistRequest {
  string user_id = 1;
}

message GetWishlistResponse {
  repeated WishlistItem items = 1;
  int32 count = 2;
  string message = 3;
}

message WishlistResponse {
  bool success = 1;
  string message = 2;
}

// GetUserStatisticsRequest is used to request user statistics for admin
// dashboard
message GetUserStatisticsRequest {
  // Empty request as we'll return all statistics
}

// GetUserStatisticsResponse contains user statistics
message GetUserStatisticsResponse {
  int32 total_users = 1;
  double user_growth = 2;
  int32 new_users = 3;
  double new_user_growth = 4;
  int32 visitors = 5;
  double visitor_growth = 6;
  int32 active_users = 7;
  int32 repeat_customers = 8;
  int32 shop_visitors = 9;
  double conversion_rate = 10;
}

// GetUserActivityChartRequest is used to request user activity chart data
message GetUserActivityChartRequest {
  int32 days = 1;  // Number of days to include in the chart
}

// UserActivityChartPoint represents a single data point in the activity chart
message UserActivityChartPoint {
  string day = 1;   // Day of week (e.g., "Mon")
  string date = 2;  // Full date (e.g., "2023-07-10")
  int32 count = 3;  // Number of active users on this day
}

// GetUserActivityChartResponse contains user activity chart data
message GetUserActivityChartResponse {
  repeated UserActivityChartPoint chart_data = 1;
}