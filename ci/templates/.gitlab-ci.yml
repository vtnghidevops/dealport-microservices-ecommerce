########################################################
#### Stage 10: Push artifacts to MinIO
########################################################
generate-sbom-files:
  stage: push-artifacts
  extends: .prepare-vars-and-docker-login
  # needs:
  # - job: deploy-staging
  #   optional: true
  # - job: deploy-prod
  #   optional: true
  variables:
    GIT_STRATEGY: none
  script:
  - |
    mkdir -p sbom-files
    docker pull $IMAGE_TAG
    docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd)/sbom-files:/sbom-files $TRIVY_IMAGE image --format cyclonedx -o /sbom-files/${CI_PROJECT_NAME}-sbom.json $IMAGE
  artifacts:
    paths:
    - sbom-files
    expire_in: 1 day
  tags:
  - k8s-shell-runner
  rules:
    - if: $CI_COMMIT_TAG =~ /-staging$/
      when: manual
    - if: $CI_COMMIT_TAG =~ /-prod$/
      when: manual

upload_to_minio:
  image: ${MINIO_IMAGE}
  stage: push-artifacts
  needs:
  - job: generate-sbom-files
    artifacts: true
  - job: unit-test
    artifacts: true
  - job: gitleaks-secret-scan
    artifacts: true
  - job: trivyfs-code-security-scan
    artifacts: true
  - job: trivy-image-security-scan
    artifacts: true
  - job: snyk-scan
    artifacts: true
  - job: sonarqube-code-quality-scan
    artifacts: true
    optional: true
  # - job: smoke-test
  #   artifacts: true
  #   optional: true
  # - job: load-test
  #   artifacts: true
  #   optional: true
  # - job: stress-test
  #   artifacts: true
  #   optional: true
  # - job: owasp-zap-scan
  #   artifacts: true
  #   optional: true
  
  variables:
    GIT_STRATEGY: none
  script:
  - |
    echo "Uploading all artifacts to MinIO..."
    TIMESTAMP=$(date +%Y%m%d)
    ARTIFACT_DIR="${TIMESTAMP}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    mkdir -p $ARTIFACT_DIR

    # Create organized subdirectories
    mkdir -p $ARTIFACT_DIR/{sbom,security-scans,dast-reports,performance-tests,test-reports,code-quality}

    # Copy SBOM files
    if [ -d "sbom-files" ]; then
      echo "Copying SBOM files..."
      cp -r sbom-files/* $ARTIFACT_DIR/sbom/
    fi

    # Copy security scan reports
    echo "Copying security scan reports..."
    for scan_folder in ${GITLEAKS_FOLDER} ${TRIVY_IMG_FOLDER} ${TRIVYFS_FOLDER} ${SNYK_FOLDER}; do
      if [ -d "$scan_folder" ]; then
        scan_name=$(basename $scan_folder)
        echo "Copying $scan_name reports..."
        cp -r "$scan_folder"/* $ARTIFACT_DIR/security-scans/$scan_name/
      fi
    done

    # Copy DAST reports
    if [ -d "${DAST_REPORT_DIR}" ]; then
      echo "Copying DAST reports..."
      cp -r ${DAST_REPORT_DIR}/* $ARTIFACT_DIR/dast-reports/
    fi

    # # Copy performance test results
    # if [ -d "${TEST_RESULTS_DIR}" ]; then
    #   echo "Copying performance test results..."
    #   cp -r ${TEST_RESULTS_DIR}/* $ARTIFACT_DIR/performance-tests/
    # fi

    # Copy unit test reports
    if [ -d "test-reports" ]; then
      echo "Copying unit test reports..."
      cp -r test-reports/* $ARTIFACT_DIR/test-reports/
    fi

    # Copy SonarQube reports
    if [ -d "${SONAR_FOLDER}" ]; then
      echo "Copying SonarQube reports..."
      cp -r ${SONAR_FOLDER}/* $ARTIFACT_DIR/code-quality/
    fi

    # Create artifact manifest
    echo "Creating artifact manifest..."
    cat > $ARTIFACT_DIR/manifest.json << EOF
    {
      "project": "${CI_PROJECT_NAME}",
      "commit": "${CI_COMMIT_SHA}",
      "tag": "${CI_COMMIT_TAG}",
      "branch": "${CI_COMMIT_REF_NAME}",
      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "pipeline_id": "${CI_PIPELINE_ID}",
      "artifacts": {
        "sbom": "$(find $ARTIFACT_DIR/sbom -type f 2>/dev/null | wc -l) files",
        "security_scans": "$(find $ARTIFACT_DIR/security-scans -type f 2>/dev/null | wc -l) files",
        "dast_reports": "$(find $ARTIFACT_DIR/dast-reports -type f 2>/dev/null | wc -l) files",
        "performance_tests": "$(find $ARTIFACT_DIR/performance-tests -type f 2>/dev/null | wc -l) files",
        "test_reports": "$(find $ARTIFACT_DIR/test-reports -type f 2>/dev/null | wc -l) files",
        "code_quality": "$(find $ARTIFACT_DIR/code-quality -type f 2>/dev/null | wc -l) files"
      }
    }
    EOF

    # Upload to MinIO with organized structure
    echo "Uploading to MinIO bucket: ${MINIO_BUCKET}..."
    mc alias set myminio "${MINIO_URL}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
    mc mirror "${ARTIFACT_DIR}" myminio/"${MINIO_BUCKET}"/"${CI_PROJECT_NAME}"/"${ARTIFACT_DIR}"
    
    echo "Upload completed successfully!"
    echo "Artifact location: myminio/${MINIO_BUCKET}/${CI_PROJECT_NAME}/${ARTIFACT_DIR}"
  artifacts:
    paths:
    - $ARTIFACT_DIR
    expire_in: 1 day
  tags:
  - devops-k8s-runner
  rules:
    - if: $CI_COMMIT_TAG =~ /-staging$/
      when: manual
    - if: $CI_COMMIT_TAG =~ /-prod$/
      when: manual
