stages:
- unit-test
- scan-code
- build-and-push-image
- scan-image
- deploy-dev
- deploy-staging
- dast-scan  
- performance-test
- deploy-prod
- push-artifacts

# Variables
variables:
  # Docker & Container Registry
  DOCKER_IMAGE: "docker:28-dind"
  

  # MinIO Configuration
  MINIO_IMAGE: "minio/mc:latest"

  # Security Scanning Tools
  TRIVY_IMAGE: "ghcr.io/aquasecurity/trivy:latest" # Use the official Trivy image
  GITLEAKS_IMAGE: "zricethezav/gitleaks:latest"
  SNYK_IMAGE: "snyk/snyk:node"
  SEVERITY_LEVELS: "HIGH,CRITICAL"
  SCAN_OPTIONS: "--no-progress --ignore-unfixed"

  # Code Quality
  SONAR_IMAGE: "sonarsource/sonar-scanner-cli:11"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"

  # Base paths for reports
  SECURITY_SCAN_BASE: "./security-scan-results"
  REPORT_NAME: "${CI_PROJECT_NAME}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"

  # Report paths
  GITLEAKS_FOLDER: "${SECURITY_SCAN_BASE}/secrets"
  GITLEAKS_REPORT_FILENAME: "${GITLEAKS_FOLDER}/gitleaks_scan_${REPORT_NAME}_report.html"
  TRIVY_IMG_FOLDER: "${SECURITY_SCAN_BASE}/trivy-image"
  TRIVY_IMG_REPORT_FILENAME: "${TRIVY_IMG_FOLDER}/trivy_img_scan_${REPORT_NAME}_report.html"
  TRIVYFS_FOLDER: "${SECURITY_SCAN_BASE}/trivy-fs"
  TRIVYFS_REPORT_FILENAME: "${TRIVYFS_FOLDER}/trivyfs_scan_${REPORT_NAME}_report.html"
  SNYK_FOLDER: "${SECURITY_SCAN_BASE}/snyk"
  SNYK_REPORT_FILENAME: "${SNYK_FOLDER}/snyk_scan_${REPORT_NAME}_report.html"
  SONAR_FOLDER: "${SECURITY_SCAN_BASE}/sonar"
  SONAR_REPORT_FILENAME: "${SONAR_FOLDER}/sonar_scan_${REPORT_NAME}_report.html"

  # k6 Test Performance
  K6_IMAGE: "grafana/k6:0.46.0"
  PERFORMANCE_TEST_DIR: "scripts/performance-tests"
  TEST_RESULTS_DIR: "performance-results"
  STAGING_TIMEOUT: "1800" # 30 minutes (1800 seconds)

  # OWASP ZAP DAST Testing
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable"
  DAST_REPORT_DIR: "./dast-reports"

  # Git & Deployment
  GITHUB_USERNAME: "philogn"
  HELM_REPO: "Three-tier-app-HelmChart"
  HELM_VALUES_PATH: "./values.yaml"


# Template
.prepare-vars-and-docker-login:
  image: ${DOCKER_IMAGE}
  services:
  - ${DOCKER_IMAGE}
  before_script:
  - echo "$HARBOR_PASSWD" | docker login $HARBOR_URL -u 'robot$'"$HARBOR_USERNAME" --password-stdin
  - BRANCH_NAME=$(echo "$CI_COMMIT_TAG" | awk -F'-' '{print $2}')
  - IMAGE_TAG="${HARBOR_URL}/${HARBOR_REPO}/${BRANCH_NAME}:${CI_COMMIT_SHORT_SHA}"

.env-dev: 
  environment:
    name: dev
    url: ${DEV_URL}

.env-staging: 
  environment:
    name: staging
    url: ${STAGING_URL}

.env-prod: 
  environment:
    name: prod
    url: ${PROD_URL}

.performance-test-base:
  image: ${K6_IMAGE}
  stage: performance-test
  variables:
    GIT_STRATEGY: clone
    ENVIRONMENT: "staging"
    TARGET_URL: ${STAGING_URL}
  before_script:
  - mkdir -p ${TEST_RESULTS_DIR}
  - cd ${PERFORMANCE_TEST_DIR}
  artifacts:
    paths:
    - ${TEST_RESULTS_DIR}/
    expire_in: 30 days  # Extend to 30 days for better trend analysis
    reports:
      performance: ${TEST_RESULTS_DIR}/*.json
    when: always  # Keep artifacts even if test fails
  tags:
  - k8s-shell-runner

########################################################
#### Stage 1: Unit test
########################################################
unit-test:
  stage: unit-test
  extends: .env-dev
  variables:
    GIT_STRATEGY: clone
  script:
    - |
      echo "Running Go unit tests..."
      mkdir -p test-reports
      TEST_OUTPUT=$(go test ./tests/unit/... -v 2>&1)
      
      # Save test output to file
      echo "$TEST_OUTPUT" > test-reports/unit-test-output.txt
      
      # Check if test output contains FAIL
      if echo "$TEST_OUTPUT" | grep -q "FAIL"; then
        echo "Unit tests failed! Found FAIL in test output."
        exit 1
      else
        echo "All unit tests passed successfully."
      fi
  artifacts:
    paths:
      - test-reports/
    expire_in: 1 day
    when: always
  tags:
    - k8s-shell-runner
  rules:
    - if: '$CI_COMMIT_TAG =~ /.*-frontend-.*/'
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success

########################################################
#### Stage 2: Scan Code
########################################################
gitleaks-secret-scan:
  stage: scan-code
  extends: .env-dev
  image: ${GITLEAKS_IMAGE}
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
  before_script:
  - apk add --no-cache curl
  - curl -s -o basic.tmpl https://raw.githubusercontent.com/gitleaks/gitleaks/master/report_templates/basic.tmpl
  script:
  - |
    echo "=== Scanning for secrets with GitLeaks ==="
    mkdir -p ${GITLEAKS_FOLDER}

    gitleaks detect \
      --source="." \
          --no-git \
          --report-format=template \
          --report-template=basic.tmpl \
      --report-path="${GITLEAKS_REPORT_FILENAME}" \
          --verbose || SCAN_STATUS=$?

    if [ "${SCAN_STATUS:-0}" -ne 0 ]; then
      echo "Secrets detected in source code! Check report: ${GITLEAKS_REPORT_FILENAME}"
      exit 1
    else
      echo "No secrets detected in source code."
    fi
  artifacts:
    paths:
    - "${GITLEAKS_REPORT_FILENAME}"
    expire_in: 1 day
    reports:
      sast: "${GITLEAKS_REPORT_FILENAME}"
  tags:
  - k8s-shell-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

trivyfs-code-security-scan:
  stage: scan-code
  extends: .env-dev
  image: ${TRIVY_IMAGE}
  variables:
    GIT_STRATEGY: clone
  before_script:
  - apk add --no-cache curl
  - curl -s -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
  script:
  - |
    mkdir -p ${TRIVYFS_FOLDER}
    trivy fs --severity ${SEVERITY_LEVELS} --format template --template "@html.tpl" --output "${TRIVYFS_REPORT_FILENAME}" "./" || echo "Scan completed with findings"
  artifacts:
    paths:
    - "${TRIVYFS_REPORT_FILENAME}"
    expire_in: 1 day
    reports:
      sast: "${TRIVYFS_REPORT_FILENAME}"
  tags:
  - k8s-shell-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

snyk-scan:
  stage: scan-code
  extends: .env-dev
  image: ${SNYK_IMAGE}
  variables:
    GIT_STRATEGY: clone
  before_script:
  - npm install -g snyk-to-html
  script:
  - |
    echo "=== Running Snyk Security Scan ==="
    mkdir -p ${SNYK_FOLDER}
    
    # Dependencies scan
    if [ -f "package.json" ]; then
      echo "Scanning npm dependencies..."
      npm install
      snyk test --severity-threshold=high --json-file-output=deps.json || echo "Dependencies scan completed with vulnerabilities"
    elif [ -f "go.mod" ]; then
      echo "Scanning Go modules..."
      go mod download
      snyk test --severity-threshold=high --json-file-output=deps.json || echo "Go modules scan completed with vulnerabilities"
    fi
    
    # Code scan
    echo "Scanning source code..."
    snyk code test --severity-threshold=high --json-file-output=code.json || echo "Code scan completed with vulnerabilities"
    
    # Generate HTML report
    echo "Generating HTML report..."
    echo "Files in current directory:"
    ls -la *.json 2>/dev/null || echo "No JSON files found"
    
    echo "<html><body><h1>Snyk Security Report</h1>" > "${SNYK_REPORT_FILENAME}"
    echo "<p>Generated: $(date)</p>" >> "${SNYK_REPORT_FILENAME}"
    
    if [ -f "deps.json" ]; then
      echo "Converting deps.json to HTML..."
      snyk-to-html -i deps.json -o deps.html || echo "Warning: Failed to convert deps.json to HTML"
      if [ -f "deps.html" ]; then
        echo "<h2>Dependencies Vulnerabilities</h2>" >> "${SNYK_REPORT_FILENAME}"
        cat deps.html >> "${SNYK_REPORT_FILENAME}"
      else
        echo "<h2>Dependencies (Raw JSON)</h2>" >> "${SNYK_REPORT_FILENAME}"
        echo "<pre>$(cat deps.json)</pre>" >> "${SNYK_REPORT_FILENAME}"
      fi
    else
      echo "<h2>Dependencies</h2><p>No deps.json found</p>" >> "${SNYK_REPORT_FILENAME}"
    fi
    
    if [ -f "code.json" ]; then
      echo "Converting code.json to HTML..."
      snyk-to-html -i code.json -o code.html || echo "Warning: Failed to convert code.json to HTML"
      if [ -f "code.html" ]; then
        echo "<h2>Source Code Vulnerabilities</h2>" >> "${SNYK_REPORT_FILENAME}"
        cat code.html >> "${SNYK_REPORT_FILENAME}"
      else
        echo "<h2>Source Code (Raw JSON)</h2>" >> "${SNYK_REPORT_FILENAME}"
        echo "<pre>$(cat code.json)</pre>" >> "${SNYK_REPORT_FILENAME}"
      fi
    else
      echo "<h2>Source Code</h2><p>No code.json found</p>" >> "${SNYK_REPORT_FILENAME}"
    fi
    
    echo "</body></html>" >> "${SNYK_REPORT_FILENAME}"
    echo "Report generated: ${SNYK_REPORT_FILENAME}"
    
    # Verify report was created
    if [ -f "${SNYK_REPORT_FILENAME}" ]; then
      echo "HTML report successfully created at: ${SNYK_REPORT_FILENAME}"
      ls -la "${SNYK_REPORT_FILENAME}"
    else
      echo "ERROR: Failed to create HTML report!"
    fi
  artifacts:
    paths:
    - "${SNYK_REPORT_FILENAME}"
    expire_in: 1 day
    reports:
      sast: "${SNYK_REPORT_FILENAME}"
  tags:
  - k8s-shell-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

sonarqube-code-quality-scan:
  stage: scan-code
  extends: .env-dev
  image:
    name: ${SONAR_IMAGE}
    entrypoint: [ "" ]
  variables:
    SONAR_USER_HOME: ${SONAR_USER_HOME}
    GIT_DEPTH: "0" 
  cache:
    policy: pull-push
    key: "sonar-cache-${CI_PROJECT_NAME}"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - ".sonar/"
  before_script:
    - mkdir -p "${SONAR_USER_HOME}/cache"
    - ls -la "${SONAR_USER_HOME}/" || echo "SONAR_USER_HOME directory not found"
  script:
    - echo "Running SonarQube analysis..."
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -X
  allow_failure: true
  tags:
  - k8s-shell-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success


########################################################
#### Stage 3: build and push images
########################################################
build-and-push-image:
  stage: build-and-push-image
  extends: 
  - .prepare-vars-and-docker-login
  - .env-dev
  variables:
    GIT_STRATEGY: clone
    VITE_PUBLIC_BROKER_API_URL: ${API_URL} # Frontend build environment variables
  script:
    - |
      # Build image
      if [ "$BRANCH_NAME" == "frontend" ]; then
        echo "Building frontend Docker images with environment variables..."
        docker build \
          --build-arg VITE_PUBLIC_BROKER_API_URL="${VITE_PUBLIC_BROKER_API_URL}" \
          -t $IMAGE_TAG . 
      else
        echo "Building ${BRANCH_NAME} Docker images..."
        docker build -t $IMAGE_TAG .
      fi
      
      # Push image immediately after build
      echo "Pushing image to ${IMAGE_TAG}"
      docker push ${IMAGE_TAG}
      
      echo "Build and push completed successfully!"
  tags:
    - k8s-image-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

########################################################
#### Stage 4: Scan image with trivy image
########################################################
trivy-image-security-scan:
  stage: scan-image
  extends: .env-dev
  before_script:
    - apk add --no-cache curl docker-cli
    - echo "$HARBOR_PASSWD" | docker login $HARBOR_URL -u 'robot$'"$HARBOR_USERNAME" --password-stdin
    - BRANCH_NAME=$(echo "$CI_COMMIT_TAG" | awk -F'-' '{print $2}')
    - IMAGE_TAG="${HARBOR_URL}/${HARBOR_REPO}/${BRANCH_NAME}:${CI_COMMIT_SHORT_SHA}"
    - curl -s -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
  image: ${TRIVY_IMAGE}
  variables:
    GIT_STRATEGY: none
  script:
  - |
    echo "Scanning image: $IMAGE_TAG"
    mkdir -p ${TRIVY_IMG_FOLDER}
    trivy image --skip-version-check --format template --template "@html.tpl" --output "${TRIVY_IMG_REPORT_FILENAME}" $IMAGE_TAG || echo "Scan completed with findings"
    echo "Scan completed with findings"
  artifacts:
    paths:
    - "${TRIVY_IMG_REPORT_FILENAME}"
    expire_in: 1 day
    reports:
      sast: "${TRIVY_IMG_REPORT_FILENAME}"
  tags:
  - k8s-image-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

