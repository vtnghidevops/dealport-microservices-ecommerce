stages:
  - dast-scan
  - performance-test
  - push-artifacts

variables:
  # k6 Test Performance
  K6_IMAGE: "grafana/k6:0.46.0"
  PERFORMANCE_TEST_DIR: "scripts/performance-tests"
  TEST_RESULTS_DIR: "performance-results"
  PRE_PROD_TIMEOUT: "1800" # 30 minutes (1800 seconds)

  # OWASP ZAP DAST Testing
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable"
  DAST_REPORT_DIR: "./dast-reports"

  # MinIO Configuration
  MINIO_IMAGE: "minio/mc:latest"

# Template
.env-staging: 
  environment:
    name: staging
    url: ${STAGING_URL}

.performance-test-base:
  image: ${K6_IMAGE}
  stage: performance-test
  variables:
    GIT_STRATEGY: clone
    ENVIRONMENT: "staging"
    TARGET_URL: ${STAGING_URL}
  before_script:
  - mkdir -p ${TEST_RESULTS_DIR}
  - cd ${PERFORMANCE_TEST_DIR}
  artifacts:
    paths:
    - ${TEST_RESULTS_DIR}/
    expire_in: 30 days  # Extend to 30 days for better trend analysis
    reports:
      performance: ${TEST_RESULTS_DIR}/*.json
    when: always  # Keep artifacts even if test fails
  tags:
  - k8s-shell-runner

# ########################################################
# #### Stage 7: DAST Security Testing
# ########################################################
owasp-zap-scan:
  stage: dast-scan
  extends: .env-staging
  image: ${ZAP_IMAGE}
  variables:
    GIT_STRATEGY: none
  before_script:
    - mkdir -p ${DAST_REPORT_DIR}
    - echo "Starting OWASP ZAP security scan for ${STAGING_URL}"
  script:
    - |
      echo "=== OWASP ZAP Security Testing ==="
      
      # 1. ZAP Baseline Scan (Quick)
      echo "Phase 1: ZAP Baseline Scan..."
      zap-baseline.py -t ${STAGING_URL} \
        -r ${DAST_REPORT_DIR}/zap-baseline-report.html \
        -x ${DAST_REPORT_DIR}/zap-baseline-report.xml || BASELINE_EXIT=$?
      
      # 2. ZAP Full Scan (Comprehensive)  
      echo "Phase 2: ZAP Full Scan..."
      zap-full-scan.py -t ${STAGING_URL} \
        -r ${DAST_REPORT_DIR}/zap-full-scan-report.html \
        -x ${DAST_REPORT_DIR}/zap-full-scan-report.xml || FULL_EXIT=$?
      
      # 3. Generate Security Summary
      echo "Phase 3: Generating Security Summary..."
      cat > ${DAST_REPORT_DIR}/dast-summary.txt << EOF
      DAST Security Scan Results - $(date +%Y-%m-%d)
      Target: ${STAGING_URL}
      Pipeline: ${CI_PIPELINE_ID}
      
      Baseline Scan: $([ "${BASELINE_EXIT:-0}" -eq 0 ] && echo "PASSED" || echo "ISSUES FOUND")
      Full Scan: $([ "${FULL_EXIT:-0}" -eq 0 ] && echo "PASSED" || echo "ISSUES FOUND")
      
      Reports: zap-baseline-report.html, zap-full-scan-report.html
      EOF
      
      # 4. Security Assessment
      if [ "${FULL_EXIT:-0}" -eq 2 ] || [ "${BASELINE_EXIT:-0}" -eq 2 ]; then
        echo "CRITICAL SECURITY VULNERABILITIES DETECTED!"
        echo "BLOCKING DEPLOYMENT TO PRODUCTION"
        exit 1
      elif [ "${FULL_EXIT:-0}" -eq 1 ] || [ "${BASELINE_EXIT:-0}" -eq 1 ]; then
        echo "MEDIUM RISK VULNERABILITIES DETECTED"
        echo "Review recommended but deployment not blocked"
      else
        echo "NO CRITICAL VULNERABILITIES DETECTED"
        echo "Security scan passed - Safe for production deployment"
      fi
  artifacts:
    paths:
      - ${DAST_REPORT_DIR}/
    expire_in: 7 days
    reports:
      dast: ${DAST_REPORT_DIR}/*.xml
    when: always
  tags:
    - k8s-shell-runner
  timeout: 60m  # Extended for comprehensive scanning
  rules:
    - if: $CI_COMMIT_TAG =~ /-pre-prod$/
      when: manual  

########################################################
#### Stage 8: Performance Testing
########################################################
# Smoke test
smoke-test:
  extends: .performance-test-base
  script:
  - |
    echo "Running smoke tests for staging environment..."
    k6 run --out json=../${TEST_RESULTS_DIR}/smoke-results.json tests/smoke-test.js
  rules:
    - if: $CI_COMMIT_TAG =~ /-pre-prod$/
      when: manual

# Load test
load-test:
  extends: .performance-test-base
  script:
  - |
    echo "Running load tests for staging environment..."
    k6 run --out json=../${TEST_RESULTS_DIR}/load-results.json tests/load-test.js
  timeout: 30m
  rules:
    - if: $CI_COMMIT_TAG =~ /-pre-prod$/
      when: manual

# Stress test
stress-test:
  extends: .performance-test-base
  script:
  - |
    echo "Running stress tests for staging environment..."
    k6 run --out json=../${TEST_RESULTS_DIR}/stress-results.json tests/stress-test.js || STRESS_EXIT_CODE=$?

    # Check if stress test failed critically
    if [ "${STRESS_EXIT_CODE:-0}" -ne 0 ]; then
      echo "Critical performance issues detected!"
      exit 1
    fi
  timeout: 45m
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /-pre-prod$/
      when: manual

upload_to_minio:
  image: ${MINIO_IMAGE}
  stage: push-artifacts
  extends: .env-staging
  needs:
  - job: smoke-test
    artifacts: true
    optional: true
  - job: load-test
    artifacts: true
    optional: true
  - job: stress-test
    artifacts: true
    optional: true
  - job: owasp-zap-scan
    artifacts: true
    optional: true
  
  variables:
    GIT_STRATEGY: none
  script:
  - |
    echo "Uploading pre-prod artifacts to MinIO..."
    TIMESTAMP=$(date +%Y%m%d)
    ARTIFACT_DIR="pre-prod-${TIMESTAMP}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    mkdir -p $ARTIFACT_DIR

    # Create organized subdirectories
    mkdir -p $ARTIFACT_DIR/{dast-reports,performance-tests}

    # Copy DAST reports
    if [ -d "${DAST_REPORT_DIR}" ]; then
      echo "Copying DAST reports..."
      cp -r ${DAST_REPORT_DIR}/* $ARTIFACT_DIR/dast-reports/
    fi

    # # Copy performance test results
    # if [ -d "${TEST_RESULTS_DIR}" ]; then
    #   echo "Copying performance test results..."
    #   cp -r ${TEST_RESULTS_DIR}/* $ARTIFACT_DIR/performance-tests/
    # fi

    # Create artifact manifest
    echo "Creating artifact manifest..."
    cat > $ARTIFACT_DIR/manifest.json << EOF
    {
      "project": "${BRANCH_NAME}",
      "commit": "${CI_COMMIT_SHA}",
      "tag": "${CI_COMMIT_TAG}",
      "branch": "${CI_COMMIT_REF_NAME}",
      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "pipeline_id": "${CI_PIPELINE_ID}",
      "artifacts": {
        "dast_reports": "$(find $ARTIFACT_DIR/dast-reports -type f 2>/dev/null | wc -l) files",
        "performance_tests": "$(find $ARTIFACT_DIR/performance-tests -type f 2>/dev/null | wc -l) files",
      }
    }
    EOF

    # Upload to MinIO with organized structure
    echo "Uploading to MinIO bucket: ${MINIO_BUCKET}..."
    mc alias set myminio "${MINIO_URL}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
    mc mirror "${ARTIFACT_DIR}" myminio/"${MINIO_BUCKET}"/"${BRANCH_NAME}"/"${ARTIFACT_DIR}"
    
    echo "Upload completed successfully!"
    echo "Artifact location: myminio/${MINIO_BUCKET}/${BRANCH_NAME}/${ARTIFACT_DIR}"
  artifacts:
    paths:
    - $ARTIFACT_DIR
    expire_in: 1 day
  tags:
  - devops-k8s-runner
  rules:
    - if: $CI_COMMIT_TAG =~ /-pre-prod$/
      when: manual