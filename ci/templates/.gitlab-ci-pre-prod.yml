stages:
 # - dast-scan
  - performance-test
 # - push-artifacts

variables:
  # k6 Test Performance
  K6_IMAGE: "grafana/k6:0.46.0"
  PERFORMANCE_TEST_DIR: "scripts/performance-tests"
  TEST_RESULTS_DIR: "performance-results"
  PRE_PROD_TIMEOUT: "1800" # 30 minutes (1800 seconds)

  # OWASP ZAP DAST Testing
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable"
  ZAP_WORK_DIR: "/zap/wrk"
  DAST_REPORT_DIR: "./dast-reports"

  # MinIO Configuration
  MINIO_IMAGE: "bitnami/minio-client:latest"

.env-staging: 
  environment:
    name: staging
    url: ${STAGING_URL}

.performance-test-base:
  image: 
    name: ${K6_IMAGE}
    entrypoint: [""]
  stage: performance-test
  extends: .env-staging
  variables:
    GIT_STRATEGY: clone
    ENVIRONMENT: "staging"
    TARGET_URL: ${STAGING_API_URL}
  before_script:
    - mkdir -p ${TEST_RESULTS_DIR}
    - cd ${PERFORMANCE_TEST_DIR}
  artifacts:
    paths:
      - ${TEST_RESULTS_DIR}/
    expire_in: 30 days  # Extend to 30 days for better trend analysis
    reports:
      performance: ${TEST_RESULTS_DIR}/*.json
    when: always  # Keep artifacts even if test fails
  after_script:
    - echo "=== Final artifact check ==="
    - echo "Current directory:" && pwd
    - echo "Contents of workspace root:"
    - ls -la /builds/ecommerce-project-devops/ecommerce-microservices/
    - echo "Contents of results directory:"
    - ls -la ${TEST_RESULTS_DIR}/ || echo "Results directory not found"
    - echo "Looking for JSON files:"
    - find . -name "*.json" -type f || echo "No JSON files found"
  tags:
    - perf-docker-runner

