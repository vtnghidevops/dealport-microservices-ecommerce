<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error - e-commerce</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 0 1rem;
      text-align: center;
    }

    .container {
      max-width: 28rem;
      padding: 2rem;
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      color: #ef4444;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    p {
      color: #4b5563;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .error-code {
      font-family: monospace;
      background-color: #f3f4f6;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      margin: 0 0.25rem;
    }

    .error-message {
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Server Error</h1>
    <p>
      We're experiencing some technical difficulties right now.
      Our team has been notified and is working to fix the issue.
    </p>
    <p>
      Error code: <span class="error-code" id="errorCode">50x</span>
    <div class="error-message" id="errorMessage"></div>
    </p>
    <a href="/" class="btn">Go back to homepage</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Get the error code from the URL or cookie if passed by Nginx
      const urlParams = new URLSearchParams(window.location.search);
      const statusCode = urlParams.get('code') || '50x';

      // Update the error code display
      const errorCodeElement = document.getElementById('errorCode');
      errorCodeElement.textContent = statusCode;

      // Show a specific message based on the status code
      const errorMessageElement = document.getElementById('errorMessage');
      const errorMessages = {
        '500': 'Internal Server Error',
        '502': 'Bad Gateway',
        '503': 'Service Unavailable',
        '504': 'Gateway Timeout'
      };

      errorMessageElement.textContent = errorMessages[statusCode] || '';
    });
  </script>
</body>

</html>
